<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aiyedrix · Interview Reports</title>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/app.css" />
</head>
<body class="app">
  <div class="app-shell" data-page="reports" data-base="../">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="workspace">
      <header class="topbar">
        <button class="icon-btn sidebar-toggle" data-toggle="sidebar" aria-label="Toggle sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="crumbs"><a href="../app.html">Home</a><span> / </span><span>Interview Reports</span></div>
      </header>

      <div class="content">
        <section class="welcome">
          <div><h1>Interview Reports</h1><p class="muted">Every Copilot session you've run, with the full transcript and AI suggestions saved.</p></div>
        </section>

        <div id="reportsBody"><p class="muted">Loading…</p></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/aiyedrix-api.js"></script>
  <script>
    const body = document.getElementById('reportsBody');

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function fmtDate(s) {
      if (!s) return '—';
      const d = new Date(s.replace(' ', 'T') + 'Z');
      if (isNaN(d)) return s;
      return d.toLocaleString();
    }
    function fmtDuration(s) {
      if (!s) return '—';
      if (s < 60) return s + 's';
      if (s < 3600) return Math.round(s / 60) + ' min';
      return (s / 3600).toFixed(1) + ' h';
    }

    function renderMarkdown(md) {
      const lines = String(md || '').split('\n');
      const out = [];
      let inList = false;
      for (const raw of lines) {
        const t = raw.trim();
        if (/^[-*] /.test(t)) {
          if (!inList) { out.push('<ul>'); inList = true; }
          out.push(`<li>${inline(t.replace(/^[-*]\s+/, ''))}</li>`);
        } else {
          if (inList) { out.push('</ul>'); inList = false; }
          if (t === '') out.push('');
          else out.push(`<p>${inline(t)}</p>`);
        }
      }
      if (inList) out.push('</ul>');
      return out.join('\n');
    }
    function inline(s) {
      return escapeHtml(s)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/\*([^*]+)\*/g, '<i>$1</i>');
    }

    async function load() {
      body.innerHTML = '<p class="muted">Loading…</p>';
      try {
        const sessions = await window.aiyedrix.sessions.list();
        if (sessions.length === 0) {
          body.innerHTML = `
            <div class="card panel" style="text-align:center; padding:2rem;">
              <h3>No sessions yet</h3>
              <p class="muted">Run your first AI Copilot session and it'll show up here — transcript, AI answers, and a replay.</p>
              <a class="btn btn-primary" href="copilot.html">+ Start a Copilot session</a>
            </div>`;
          return;
        }

        body.innerHTML = `<section class="card panel"><header class="panel-head"><h3>All sessions</h3><span class="muted small">${sessions.length} total</span></header><ul class="session-list" id="sessList"></ul></section>`;
        const ul = document.getElementById('sessList');
        ul.innerHTML = sessions.map((s) => {
          const dotClass = s.score >= 8 ? 'good' : s.score >= 6.5 ? 'warn' : s.score != null ? 'bad' : '';
          const scoreClass = s.score >= 8 ? 'good' : s.score >= 6.5 ? 'warn' : s.score != null ? 'bad' : '';
          const sub = [s.kind, fmtDuration(s.durationSeconds), fmtDate(s.createdAt)].filter(Boolean).join(' · ');
          return `
            <li data-id="${s.id}">
              <span class="dot ${dotClass}"></span>
              <div>
                <b>${escapeHtml(s.title)}</b>
                <small class="muted">${escapeHtml(sub)}</small>
              </div>
              ${s.score != null ? `<span class="score ${scoreClass}">${s.score.toFixed(1)}</span>` : `<span class="badge">${escapeHtml(s.status)}</span>`}
            </li>`;
        }).join('');
        ul.querySelectorAll('li[data-id]').forEach((li) => {
          li.addEventListener('click', () => openSession(Number(li.dataset.id)));
        });
      } catch (e) {
        if (e.status === 401) { location.href = 'login.html'; return; }
        body.innerHTML = `<p class="error-block">${escapeHtml(e.message)}</p>`;
      }
    }

    async function openSession(id) {
      try {
        const s = await window.aiyedrix.sessions.get(id);
        const evHtml = (s.events || []).map((e) => {
          const cls = ({ interviewer: 'ev-interviewer', you: 'ev-you', aiyedrix: 'ev-aiy', system: 'ev-system' }[e.role]) || '';
          const label = ({ interviewer: 'Interviewer', you: 'You', aiyedrix: 'Aiyedrix', system: 'System' }[e.role]) || e.role;
          const inner = e.role === 'aiyedrix' ? renderMarkdown(e.text) : `<p>${inline(e.text)}</p>`;
          return `<div class="ev ${cls}"><div class="ev-head"><b>${label}</b><small class="muted">${fmtDate(e.createdAt)}</small></div>${inner}</div>`;
        }).join('') || '<p class="muted small">No events recorded.</p>';

        body.innerHTML = `
          <button class="btn btn-ghost btn-sm" id="backBtn">← All reports</button>
          <section class="card panel" style="margin-top:1rem;">
            <header class="panel-head">
              <div>
                <h2 class="q-title">${escapeHtml(s.title)}</h2>
                <small class="muted">${escapeHtml(s.kind)} · ${fmtDuration(s.durationSeconds)} · ${fmtDate(s.createdAt)} · ${s.status}</small>
              </div>
              ${s.score != null ? `<span class="score ${s.score >= 8 ? 'good' : s.score >= 6.5 ? 'warn' : 'bad'}">${s.score.toFixed(1)}</span>` : ''}
            </header>
            ${s.profileTitle ? `<p class="muted">Profile: <b>${escapeHtml(s.profileTitle)}</b></p>` : ''}
            <div class="event-stream">${evHtml}</div>
            <footer class="panel-foot">
              <button class="btn btn-ghost btn-sm danger" id="delBtn">Delete</button>
            </footer>
          </section>`;
        document.getElementById('backBtn').addEventListener('click', load);
        document.getElementById('delBtn').addEventListener('click', async () => {
          if (!confirm('Delete this session and its full transcript? This cannot be undone.')) return;
          await window.aiyedrix.sessions.delete(id);
          load();
        });
      } catch (e) {
        if (e.status === 401) { location.href = 'login.html'; return; }
        body.innerHTML = `<p class="error-block">${escapeHtml(e.message)}</p>`;
      }
    }

    load();
  </script>
</body>
</html>
